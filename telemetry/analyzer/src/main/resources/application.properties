
# ==================== SERVER CONFIG ====================
server.port=8082
spring.application.name=analyzer-service

# ==================== DATABASE CONFIG ====================
spring.datasource.url=jdbc:postgresql://localhost:5432/smarthome
spring.datasource.username=mia
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ==================== KAFKA CONFIG ====================
# Kafka Bootstrap Servers
kafka.bootstrap-servers=localhost:9092

# Kafka Topics
kafka.topics.snapshots=telemetry.snapshots.v1
kafka.topics.hubs=telemetry.hubs.v1

# Consumer Configuration
kafka.consumer.group-id.snapshots=snapshot-processor-group
kafka.consumer.group-id.hubs=hub-event-processor-group
kafka.consumer.auto-offset-reset=earliest
kafka.consumer.enable-auto-commit=false
kafka.consumer.max-poll-records=500
kafka.consumer.fetch-max-wait-ms=500
kafka.consumer.fetch-min-bytes=1

# Producer Configuration (???? ??????????? ??? dead letter queue)
kafka.producer.acks=all
kafka.producer.retries=3
kafka.producer.max-in-flight-requests-per-connection=5
kafka.producer.enable-idempotence=true

# ==================== gRPC CLIENT CONFIG ====================
# Hub Router gRPC client configuration
grpc.client.hub-router.address=static://localhost:59090
grpc.client.hub-router.enable-keep-alive=true
grpc.client.hub-router.keep-alive-without-calls=true
grpc.client.hub-router.negotiation-type=plaintext

# ==================== LOGGING CONFIG ====================
logging.level.ru.yandex.practicum.analyzer=DEBUG
logging.level.org.apache.kafka=WARN
logging.level.org.hibernate=INFO
logging.level.org.springframework.kafka=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==================== APPLICATION SPECIFIC ====================
# Polling interval for Kafka consumers (in milliseconds)
analyzer.polling-interval-ms=100

# Maximum number of retries for gRPC calls
analyzer.grpc.max-retries=3

# Timeout for gRPC calls (in milliseconds)
analyzer.grpc.timeout-ms=5000

# Enable/disable scenario execution
analyzer.scenario.execution-enabled=true

# Log level for scenario execution details
analyzer.scenario.log-level=INFO

